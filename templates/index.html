<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050810">
  <title>TORANG GUARD</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="logo">🦅TORANG GUARD🛡️</div>
      
      <p class="slogan">Dari Papua, Torang Jaga Indonesia</p>
      <p class="sub">Sa Bisa, Ko Bisa, Torang Bisa!</p>
    </section>
    <br>
    <section class="box">
      <h5>🔗 Paste Link</h5>
      <div class="input-wrap">
        <input id="url" placeholder="Paste Url Disini" autocomplete="off" inputmode="url">
        <button onclick="cek()">🔍 CEK LINK SEKARANG</button>
      </div>
      <div class="deep-check-wrap">
        <label class="deep-check-label">
          <input type="checkbox" id="deep_check" checked>
          <span>🔍 Cek Isi Website</span>
        </label>
        <br>
        <p class="deep-check-hint">Buka link-nya, cek ada minta PIN / OTP / Password atau enggak. Kalau dicentang lebih akurat (3-5 detik), kalau gak dicentang lebih cepet.</p>
      </div>

      <div id="hasil"></div>
    </section>

    <footer class="footer">
      <b>Powered by MR ONE</b>
    </footer>

  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
