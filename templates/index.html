<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#050810">
  <title>TORANG GUARD</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="logo">🦅TORANG GUARD🛡️</div>
      <br>
      <p class="slogan">Dari Papua, Torang Jaga Indonesia</p>
      <p class="sub">Sa Bisa, Ko Bisa, Torang Bisa!</p>
    </section>
    <br>
  
    <section class="box">
      <h5>🔗 Paste Link</h5>
      <div class="input-wrap">
        <input id="url" placeholder="Masukkan Url" autocomplete="off" inputmode="url">
        <button onclick="cek()">🔍 CEK LINK SEKARANG</button>
      </div>

      <!-- BARU: Tombol Cek Isi Website - Cuma ini yang ditambahin, yang lain GAK DIUBAH -->
      <div style="margin-top:10px; text-align:left; font-size:13px; color:#cbd5e1;">
        <label style="display:flex; gap:8px; align-items:center; cursor:pointer;">
          <input type="checkbox" id="deep_check" checked style="width:16px; height:16px; accent-color:#22c55e;">
          <span>🔍 Cek Isi Website</span>
        </label>
      </div>

      <div id="hasil"></div>
    </section>

    <footer class="footer">
      <b>Powered by MR ONE</b>
    </footer>

  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
